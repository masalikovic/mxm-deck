name: Uji

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang alat uji
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck
          pip install pyte==0.8.2

      - name: Jalankan uji
        env:
          MXM_UJI_KETAT: "1"
        run: bash tests/jalankan.sh
